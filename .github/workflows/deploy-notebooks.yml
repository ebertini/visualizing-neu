name: Convert and Deploy Notebooks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install nbconvert jupyter matplotlib seaborn pandas plotly numpy openpyxl
      
      - name: Convert notebooks to HTML
        run: |
          mkdir -p docs/onlineoutput
          python -m nbconvert --to html notebooks/*.ipynb --output-dir=docs/onlineoutput
          # Create .nojekyll to bypass Jekyll processing
          touch docs/.nojekyll

      - name: Generate index.html
        run: python scripts/generate_index.py
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/onlineoutput'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
