name: Convert and Deploy Notebooks

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install nbconvert jupyter matplotlib seaborn pandas plotly numpy openpyxl
      
      - name: Convert notebooks to HTML
        run: |
          mkdir -p docs/onlineoutput
          python -m nbconvert --to html notebooks/*.ipynb --output-dir=docs/onlineoutput
          # Copy interactive EnricoVis apps (PI's parallel visualization work)
          cp docs/EnricoVis/grant_atlas.html docs/onlineoutput/
          cp docs/EnricoVis/topic_hierarchy.html docs/onlineoutput/
          cp docs/EnricoVis/topic_islands.html docs/onlineoutput/
          # Round-1 topic-model visualization prototypes (own analysis work,
          # built on EnricoVis's canonical topic model but kept in a separate
          # directory). Unlike the three self-contained EnricoVis apps above,
          # these fetch() their JSON at runtime from an ES module, so the
          # whole sibling layout — shared/ (the CSS+JS kit), data/ (the
          # aggregator's committed JSON), and each page's own module
          # directory (what_we_can_see/, topic_flow/) — must be published
          # NEXT TO the HTML at the SAME relative paths they have in
          # docs/TopicVizPrototypes/, or the pages 404 on their own data.
          # (A third page, about.html, existed here before 2026-08-30 — its
          # content is now part of what_we_can_see.html's own "About this
          # data & what's missing" tab; about.html/about/ no longer exist.)
          cp docs/TopicVizPrototypes/topic_flow.html docs/onlineoutput/
          cp docs/TopicVizPrototypes/what_we_can_see.html docs/onlineoutput/
          # `mkdir -p` + `cp -r SRC/. DST/` (not `cp -r SRC DST`): if DST ever
          # already exists as a directory, `cp -r SRC DST` nests as DST/SRC
          # instead of copying SRC's contents into it — silently 404ing every
          # page while the workflow stays green. The trailing `/.` form copies
          # CONTENTS into an existing directory either way.
          mkdir -p docs/onlineoutput/shared docs/onlineoutput/data \
                   docs/onlineoutput/what_we_can_see docs/onlineoutput/topic_flow
          cp -r docs/TopicVizPrototypes/shared/.           docs/onlineoutput/shared/
          cp -r docs/TopicVizPrototypes/data/.             docs/onlineoutput/data/
          cp -r docs/TopicVizPrototypes/what_we_can_see/.  docs/onlineoutput/what_we_can_see/
          cp -r docs/TopicVizPrototypes/topic_flow/.       docs/onlineoutput/topic_flow/
          # Copy the standalone methods report
          cp docs/topic_work_report.html docs/onlineoutput/
          # Create .nojekyll INSIDE the uploaded artifact (docs/onlineoutput/,
          # not docs/) — actions/upload-pages-artifact only uploads that
          # directory, so a .nojekyll outside it never reaches Pages. (Jekyll
          # doesn't actually run under actions/deploy-pages regardless; this
          # is cheap insurance if that ever changes.) Also: never name a
          # published directory with a leading underscore — Jekyll strips
          # those — and check any new one isn't accidentally matched by a
          # bare .gitignore entry (e.g. `lib/`, `build/`, `dist/` match at
          # any depth) with `git check-ignore -v <path>` before committing.
          touch docs/onlineoutput/.nojekyll

      - name: Verify published TopicVizPrototypes data wiring
        run: python scripts/_check_topicviz.py --root docs/onlineoutput --data-only

      - name: Generate index.html
        run: python scripts/generate_index.py
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/onlineoutput'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
